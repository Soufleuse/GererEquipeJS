[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sqlserver]
command=/opt/mssql/bin/sqlservr
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=10

[program:init-db]
command=/init-db.sh
autostart=true
autorestart=false
priority=2
startretries=5
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dotnet-api]
command=/usr/bin/dotnet /app/ServiceLigueHockeySqlServer.dll
directory=/app
autostart=true
autorestart=true
priority=4
environment=ASPNETCORE_ENVIRONMENT="%(ENV_ASPNETCORE_ENVIRONMENT)s",ASPNETCORE_URLS="%(ENV_ASPNETCORE_URLS)s",DOTNET_ENVIRONMENT="%(ENV_DOTNET_ENVIRONMENT)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0